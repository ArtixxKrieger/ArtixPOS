name: Build iOS App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: Reinstall rollup (force native binary)
        run: npm install rollup --force

      - name: Rebuild native binaries
        run: npm rebuild

      - name: Patch iOS Podfile template to 15.0
        run: |
          mkdir -p /tmp/ios-template
          tar -xzf node_modules/@capacitor/cli/assets/ios-pods-template.tar.gz -C /tmp/ios-template
          sed -i '' "s/platform :ios, .*/platform :ios, '15.0'/" /tmp/ios-template/App/Podfile
          tar -czf node_modules/@capacitor/cli/assets/ios-pods-template.tar.gz -C /tmp/ios-template .

      - name: Build web assets
        run: npx vite build
        env:
          VITE_API_BASE_URL: https://artix-pos.vercel.app

      - name: Add iOS platform
        run: npx cap add ios

      - name: Set Xcode deployment target to 15.0
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Verify Podfile exists (create if missing)
        run: |
          if [ -f "ios/App/Podfile" ]; then
            echo "✅ Podfile found at ios/App/Podfile"
          else
            echo "⚠️  Podfile not found — creating minimal Podfile for Capacitor"
            cat > ios/App/Podfile << 'PODEOF'
          platform :ios, '15.0'
          use_frameworks!

          install! 'cocoapods', :disable_input_output_paths => true

          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end

          target 'App' do
            capacitor_pods
          end
          PODEOF
            echo "✅ Podfile created"
          fi
          echo "--- Podfile contents ---"
          cat ios/App/Podfile

      - name: Patch Info.plist — register deep link URL scheme
        run: |
          PLIST="ios/App/App/Info.plist"
          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST" 2>/dev/null | grep -q "com.artixpos.app"; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.artixpos.app" "$PLIST"
            echo "Info.plist patched with URL scheme"
          else
            echo "URL scheme already present — skipping"
          fi

      - name: Show final Info.plist URL schemes
        run: /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" ios/App/App/Info.plist 2>/dev/null || echo "CFBundleURLTypes not found"

      - name: Install CocoaPods dependencies
        run: cd ios/App && pod install --repo-update

      - name: Build iOS (simulator, no signing)
        run: |
          # Pick the best available iPhone 16 simulator; fall back to any available iPhone
          SIM_NAME=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9]|iPhone 1[5-9]" | head -1 | sed 's/ (.*//' | xargs)
          if [ -z "$SIM_NAME" ]; then
            SIM_NAME=$(xcrun simctl list devices available | grep "iPhone" | head -1 | sed 's/ (.*//' | xargs)
          fi
          echo "Using simulator: $SIM_NAME"
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${SIM_NAME},OS=latest" \
            -derivedDataPath ios/build \
            -allowProvisioningUpdates \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: artixpos-ios-build
          path: ios/build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 30
