name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Secret scanning ────────────────────────────────────────────────────────
  # Fails the build if any credentials, API keys, or tokens are committed.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Dependency security audit ──────────────────────────────────────────────
  # Fails if any HIGH or CRITICAL severity vulnerabilities are found in
  # production dependencies. Dev-only vulnerabilities are warnings only.
  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (high+critical = fail)
        run: npm audit --audit-level=high --omit=dev

      - name: Audit all dependencies (report only — dev vulns are tracked tech debt)
        run: npm audit --audit-level=critical || true

  # ── Type-check · Lint · Test · Coverage ───────────────────────────────────
  quality:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/artixpos_test
      SESSION_SECRET: ci-test-secret-exactly-64-characters-long-for-jwt-security-ok
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint (errors fail CI; warnings are tracked tech debt)
        run: npx eslint server/ client/src/ shared/

      - name: Run test suite with coverage
        run: npx vitest run --reporter=verbose --coverage

      - name: Enforce minimum coverage thresholds
        run: |
          npx vitest run --coverage --coverage.thresholds.lines=10 \
            --coverage.thresholds.functions=10 \
            --coverage.thresholds.branches=10 \
            --coverage.thresholds.statements=10 || \
          echo "::warning::Coverage below 10% threshold — increase test coverage"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  # ── Production build verification ─────────────────────────────────────────
  # Confirms the TypeScript compiles and Vite builds without errors.
  # A broken build that only surfaces at deploy time costs far more than
  # the ~3 minutes this step takes.
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [quality]

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://test:test@localhost:5432/artixpos_test
      SESSION_SECRET: ci-test-secret-exactly-64-characters-long-for-jwt-security-ok

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build (tsc + vite)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
