<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ArtixPOS — Clearing cache…</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:#09090f;color:#e5e7eb;
         min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{max-width:360px;width:100%;text-align:center}
    .icon{font-size:52px;margin-bottom:20px}
    h1{font-size:20px;font-weight:700;color:#fff;margin-bottom:8px}
    p{font-size:14px;color:#9ca3af;line-height:1.6;margin-bottom:24px}
    .status{font-size:13px;color:#7c3aed;margin-bottom:20px;min-height:20px}
    .bar{width:100%;height:4px;background:#1f1f2e;border-radius:4px;overflow:hidden;margin-bottom:24px}
    .fill{height:100%;background:#7c3aed;border-radius:4px;width:0%;transition:width 0.4s ease}
    a{display:inline-block;background:#7c3aed;color:#fff;text-decoration:none;
      padding:12px 28px;border-radius:10px;font-size:14px;font-weight:600;display:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🧹</div>
    <h1>Clearing site data</h1>
    <p>Removing cached files and service workers so your device loads a fresh copy of ArtixPOS.</p>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="status" id="status">Starting…</div>
    <a href="/" id="doneBtn">Go to ArtixPOS →</a>
  </div>

  <script>
    const fill   = document.getElementById('fill');
    const status = document.getElementById('status');
    const btn    = document.getElementById('doneBtn');

    function setProgress(pct, msg) {
      fill.style.width = pct + '%';
      status.textContent = msg;
    }

    async function clearEverything() {
      // 1. Unregister all service workers
      setProgress(20, 'Unregistering service workers…');
      if ('serviceWorker' in navigator) {
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        } catch(e) {}
      }

      // 2. Clear Cache Storage (SW caches)
      setProgress(50, 'Clearing cached files…');
      if (window.caches) {
        try {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        } catch(e) {}
      }

      // 3. Clear localStorage and sessionStorage
      setProgress(75, 'Clearing local storage…');
      try { localStorage.clear(); } catch(e) {}
      try { sessionStorage.clear(); } catch(e) {}

      // 4. Done
      setProgress(100, 'All done! Redirecting…');
      btn.style.display = 'inline-block';

      // Auto-redirect after 1.5 s
      setTimeout(() => { window.location.replace('/'); }, 1500);
    }

    clearEverything();
  </script>
</body>
</html>
