name: Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node 22 (required by Capacitor CLI v8) ──────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build web assets (Vite only — skip DB push in CI) ──────────────
      - name: Build web assets
        env:
          VITE_REVENUECAT_ANDROID_API_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_API_KEY }}
          VITE_REVENUECAT_IOS_API_KEY: ${{ secrets.VITE_REVENUECAT_IOS_API_KEY }}
          VITE_REVENUECAT_TEST_API_KEY: ${{ secrets.VITE_REVENUECAT_TEST_API_KEY }}
        run: npx vite build

      # ── 5. Initialise Android platform (fresh every run) ──────────────────
      - name: Add Android platform
        run: npx cap add android

      # ── 6. Inject google-services.json ────────────────────────────────────
      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "✅ google-services.json injected"
          else
            echo "⚠️  GOOGLE_SERVICES_JSON secret not set — Google Sign-In will fail on device"
          fi

      # ── 6b. Patch google-services.json package name ───────────────────────
      - name: Patch google-services.json package name
        run: |
          python3 - <<'PYEOF'
          import json, os

          path = "android/app/google-services.json"

          if not os.path.exists(path):
              print("google-services.json not found — creating placeholder")
              data = {
                  "project_info": {
                      "project_number": "000000000000",
                      "project_id": "artixpos-app",
                      "storage_bucket": "artixpos-app.appspot.com"
                  },
                  "client": [{
                      "client_info": {
                          "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                          "android_client_info": {"package_name": "com.artixpos.app"}
                      },
                      "oauth_client": [],
                      "api_key": [{"current_key": "placeholder"}],
                      "services": {"appinvite_service": {"other_platform_oauth_client": []}}
                  }],
                  "configuration_version": "1"
              }
          else:
              with open(path) as f:
                  data = json.load(f)
              changed = False
              for client in data.get("client", []):
                  pkg = client.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
                  if pkg != "com.artixpos.app":
                      print(f"Patching package_name: {pkg} → com.artixpos.app")
                      client["client_info"]["android_client_info"]["package_name"] = "com.artixpos.app"
                      changed = True
              if not changed:
                  print("✅ package_name already correct")

          with open(path, "w") as f:
              json.dump(data, f, indent=2)
          print("✅ google-services.json ready")
          PYEOF

      # ── 7. Patch deep-link intent filter in AndroidManifest.xml ──────────
      - name: Patch OAuth deep-link
        run: node script/setup-deeplink.js

      # ── 8. Sync web assets + Capacitor plugins into the native project ────
      #       Pass OAuth credentials so capacitor.config.ts bakes them in.
      - name: Sync Capacitor
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: npx cap sync android

      # ── 8. Java 21 (required by Capacitor 8 / Android Gradle plugin) ────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # ── 9. Install required Android SDK components ─────────────────────────
      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" 2>/dev/null || true

      # ── 10. Cache Gradle to speed up subsequent builds ────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 11. Make Gradle wrapper executable ────────────────────────────────
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      # ── 12. Build debug APK (every branch — for testing) ──────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 13. Upload debug APK as artifact ──────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: artixpos-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ── 13b. Post APK download link as PR comment ─────────────────────────
      - name: Comment APK link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const run_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifact_name = `artixpos-debug-${context.sha}`;
            const short_sha = context.sha.substring(0, 7);
            const body = [
              '## 📦 Debug APK Ready',
              '',
              `**Commit:** \`${short_sha}\``,
              '',
              `1. Open the [Actions run](${run_url})`,
              `2. Scroll down to **Artifacts**`,
              `3. Download **${artifact_name}**`,
              `4. Install on your Android device to test this PR`,
            ].join('\n');

            // Delete any previous APK comments on this PR to avoid clutter
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments.data) {
              if (c.body.startsWith('## 📦 Debug APK Ready')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # ── 14. Build & sign release AAB (main branch only, needs keystore) ───
      # secrets.* cannot be used in if: expressions — load into env first.
      - name: Decode keystore
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret not set — skipping release build."
            exit 0
          fi
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks

      - name: Build release AAB
        if: github.ref == 'refs/heads/main'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret not set — skipping release build."
            exit 0
          fi
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --no-daemon --stacktrace

      - name: Shred keystore
        if: always()
        run: shred -u android/keystore/release.jks 2>/dev/null || true

      - name: Upload release AAB
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: artixpos-release-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: ignore
