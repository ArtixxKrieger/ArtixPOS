    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%;overflow:hidden}
      body{font-family:'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,sans-serif}

      :root{
        --sp-bg:#f2f2f7;
        --sp-accent:#7c3aed;
        --sp-muted:#9ca3af;
        --sp-card:#ffffff;
        --sp-border:#e5e5ea;
      }
      .dark{
        --sp-bg:#09090f;
        --sp-accent:#8b5cf6;
        --sp-muted:#4b4b6b;
        --sp-card:#13131f;
        --sp-border:#1f1f33;
      }

      /* ── Splash container ── */
      #app-splash{
        position:fixed;inset:0;z-index:9999;
        background:#08080f;
        display:flex;align-items:center;justify-content:center;
        overflow:hidden;
      }
      #app-splash.sp-hiding{
        animation:sp-out 0.5s ease forwards;
      }
      @keyframes sp-out{to{opacity:0}}

      /* ── Centre stack ── */
      .sp-center{
        position:relative;z-index:2;
        display:flex;flex-direction:column;align-items:center;
        gap:32px;
      }

      /* ── Letters row ── */
      .sp-letters{
        display:flex;
        gap:0.04em;
      }
      .sp-letters span{
        display:inline-block;
        font-size:clamp(30px,5.5vw,56px);
        font-weight:800;
        font-family:'Plus Jakarta Sans',sans-serif;
        user-select:none;
        /* shimmer gradient fills each letter */
        background:linear-gradient(
          135deg,
          #a78bfa 0%,
          #ffffff 35%,
          #c4b5fd 50%,
          #ffffff 65%,
          #8b5cf6 100%
        );
        background-size:300% 300%;
        -webkit-background-clip:text;
        background-clip:text;
        -webkit-text-fill-color:transparent;
        /* entrance: drop in from above, staggered */
        animation:
          sp-drop 0.55s cubic-bezier(0.34,1.56,0.64,1) both,
          sp-shine 3.5s ease-in-out 1s infinite;
        letter-spacing:0.14em;
      }
      /* stagger each letter's entrance by 40 ms */
      .sp-letters span:nth-child(1){animation-delay:0.05s, 1s}
      .sp-letters span:nth-child(2){animation-delay:0.09s, 1.08s}
      .sp-letters span:nth-child(3){animation-delay:0.13s, 1.16s}
      .sp-letters span:nth-child(4){animation-delay:0.17s, 1.24s}
      .sp-letters span:nth-child(5){animation-delay:0.21s, 1.32s}
      .sp-letters span:nth-child(6){animation-delay:0.25s, 1.40s}
      .sp-letters span:nth-child(7){animation-delay:0.29s, 1.48s}
      .sp-letters span:nth-child(8){animation-delay:0.33s, 1.56s}
      @keyframes sp-drop{
        from{opacity:0;transform:translateY(-22px) scale(0.85)}
        to{opacity:1;transform:translateY(0)   scale(1)}
      }
      @keyframes sp-shine{
        0%,100%{background-position:0% 50%}
        50%    {background-position:100% 50%}
      }

      /* ── Three dots (cute loading indicator) ── */
      .sp-dots{
        display:flex;gap:8px;
      }
      .sp-dots span{
        width:5px;height:5px;border-radius:50%;
        background:#7c3aed;
        animation:sp-dot-bounce 1.2s ease-in-out infinite;
        opacity:0;
        animation-delay: 0.8s; /* wait until letters finish */
      }
      .sp-dots span:nth-child(1){animation-delay:0.8s}
      .sp-dots span:nth-child(2){animation-delay:1.0s}
      .sp-dots span:nth-child(3){animation-delay:1.2s}
      @keyframes sp-dot-bounce{
        0%,60%,100%{transform:translateY(0);  opacity:0.25}
        30%         {transform:translateY(-7px);opacity:1}
      }

      /* ── Crash / error UI (keep working) ── */
      #sp-crash{
        position:fixed;inset:0;display:flex;align-items:center;
        justify-content:center;background:#0a0a12;
        font-family:monospace;padding:24px;z-index:99999;
      }
    </style>

    <!-- Structured data — WebSite + Organization (Google Knowledge Graph) -->

    <script>window.__splashStart = Date.now();</script>
    <script>
      (function() {
        /* ── Dark mode: apply before React renders to avoid flash ── */
        try {
          var stored = localStorage.getItem('theme');
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          var isDark = stored === 'dark' || (!stored && mq.matches);
          document.documentElement.style.background = isDark ? '#09090f' : '#f2f2f7';
          if (isDark) document.documentElement.classList.add('dark');
          mq.addEventListener('change', function(e) {
            if (!localStorage.getItem('theme')) {
              document.documentElement.classList.toggle('dark', e.matches);
              document.documentElement.style.background = e.matches ? '#09090f' : '#f2f2f7';
            }
          });
        } catch(e) {}

        /* ── One-time console warning ── */
        console.log('%cSTOP!', 'color: red; font-size: 48px; font-weight: bold;');
        console.log('%cThis browser feature is for developers only. Do not paste anything here. Doing so may compromise your account.', 'color: black; font-size: 16px;');

        /* ── Stale-SW auto-recovery ── */
        (function() {
          var STALE_KEY = '_artix_stale_reload';
          var CRASH_KEY = '_artix_crash';

          function isChunkError(msg) {
            var s = String(msg || '');
            return (
              s.indexOf('ChunkLoadError') !== -1 ||
              s.indexOf('Loading chunk') !== -1 ||
              s.indexOf('Loading CSS chunk') !== -1 ||
              s.indexOf('Failed to fetch dynamically imported module') !== -1 ||
              s.indexOf('Importing a module script failed') !== -1 ||
              s.indexOf('Unable to preload CSS') !== -1
            );
          }

          function nukeCacheAndReload() {
            try {
              var attempts = parseInt(sessionStorage.getItem(STALE_KEY) || '0', 10);
              if (attempts >= 3) return false;
              sessionStorage.setItem(STALE_KEY, String(attempts + 1));
              var doReload = function() { window.location.reload(); };
              if (navigator.serviceWorker) {
                navigator.serviceWorker.getRegistrations()
                  .then(function(regs) {
                    return Promise.all(regs.map(function(r) { return r.unregister().catch(function(){}); }));
                  })
                  .catch(function(){})
                  .finally(function() {
                    if (window.caches) {
                      caches.keys()
                        .then(function(keys) {
                          return Promise.all(keys.map(function(k) { return caches.delete(k).catch(function(){}); }));
                        })
                        .catch(function(){})
                        .finally(doReload);
                    } else { doReload(); }
                  });
              } else if (window.caches) {
                caches.keys()
                  .then(function(keys) {
                    return Promise.all(keys.map(function(k) { return caches.delete(k).catch(function(){}); }));
                  })
                  .catch(function(){})
                  .finally(doReload);
              } else { doReload(); }
              return true;
            } catch(e) { return false; }
          }

          var _shown = false;
          function _showCrash(msg) {
            if (_shown) return;
            var splash = document.getElementById('app-splash');
            if (splash) { try { splash.remove(); } catch(e) {} }
            var root = document.getElementById('root');
            if (root) {
              _shown = true;
              function _escHtml(s) {
                return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
              }
              root.innerHTML =
                '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a12;font-family:monospace;padding:24px;z-index:99999">'
                + '<div style="max-width:480px;width:100%;background:#1a1a2e;border:1px solid #ff4d4d;border-radius:12px;padding:20px;color:#fff;">'
                + '<p style="color:#ff4d4d;font-weight:bold;font-size:14px;margin:0 0 8px">App failed to load</p>'
                + '<pre style="font-size:11px;color:#ffb3b3;white-space:pre-wrap;word-break:break-word;margin:0 0 16px;max-height:200px;overflow:auto">'
                + _escHtml(msg) + '</pre>'
                + '<button onclick="(function(){try{sessionStorage.removeItem(\'' + STALE_KEY + '\');}catch(e){}'
                + 'try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister()})});'
                + 'if(window.caches)caches.keys().then(function(k){k.forEach(function(c){caches.delete(c)})})}catch(e){}'
                + 'setTimeout(function(){window.location.reload()},400)})()" '
                + 'style="background:#7c3aed;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:13px;cursor:pointer;width:100%">'
                + 'Clear cache &amp; reload</button>'
                + '</div></div>';
              try { sessionStorage.setItem(CRASH_KEY, String(msg)); } catch(e) {}
            }
          }

          try {
            var prev = sessionStorage.getItem(CRASH_KEY);
            if (prev) { sessionStorage.removeItem(CRASH_KEY); _showCrash('[Previous load] ' + prev); }
          } catch(e) {}

          window.onerror = function(msg, src, line) {
            var full = String(msg) + '\n' + (src||'') + ':' + (line||'');
            if (isChunkError(full)) { if (nukeCacheAndReload()) return; }
            _showCrash(full);
          };

          window.addEventListener('unhandledrejection', function(e) {
            var r = e.reason;
            var msg = r && r.message ? r.message + '\n' + (r.stack||'') : String(r);
            if (isChunkError(msg)) { if (nukeCacheAndReload()) return; }
            _showCrash('Unhandled rejection: ' + msg);
          });
        })();

        /* ── Auth-loop watchdog ── */
        (function() {
          var LOOP_KEY = '_artix_loop_redirect';
          try {
            if (sessionStorage.getItem(LOOP_KEY)) {
              sessionStorage.removeItem(LOOP_KEY);
              return;
            }
          } catch(e) {}

          var authMeCount = 0;
          var windowStart = Date.now();
          var WINDOW_MS = 10000;
          var THRESHOLD = 5;

          var _origFetch = window.fetch;
          window.fetch = function(input, init) {
            var url = (typeof input === 'string') ? input : (input && input.url) ? input.url : '';
            if (url.indexOf('/api/auth/me') !== -1) {
              var now = Date.now();
              if (now - windowStart > WINDOW_MS) { authMeCount = 0; windowStart = now; }
              authMeCount++;
              if (authMeCount >= THRESHOLD) {
                authMeCount = 0;
                try { sessionStorage.setItem(LOOP_KEY, '1'); } catch(e) {}
                window.location.replace('/clear.html');
                return new Promise(function() {});
              }
            }
            return _origFetch.apply(this, arguments);
          };
        })();
      })();
    </script>
