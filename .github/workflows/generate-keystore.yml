name: 🔑 Generate Release Keystore (run once)

# Run this ONCE manually to generate your signing key.
# After running, copy the outputs into your GitHub secrets.
# Then you can disable or delete this workflow.
#
# Required GitHub Actions secrets:
#   KEYSTORE_STORE_PASS — password for the keystore file (min 6 chars)
#   KEYSTORE_KEY_PASS   — password for the key entry (can match KEYSTORE_STORE_PASS)
#   KEY_ALIAS           — alias for the key (e.g. "artixpos")
#   KEYSTORE_DNAME      — X.500 DN string, e.g. "CN=ArtixPOS, OU=Mobile, O=ArtixPOS, L=Manila, ST=Metro Manila, C=PH"
#
# Set these secrets in GitHub → Settings → Secrets and variables → Actions
# before running this workflow.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
          KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          DNAME: ${{ secrets.KEYSTORE_DNAME }}
        run: |
          if [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ] || [ -z "$ALIAS" ] || [ -z "$DNAME" ]; then
            echo "❌ Missing required secrets."
            echo "Set KEYSTORE_STORE_PASS, KEYSTORE_KEY_PASS, KEY_ALIAS, and KEYSTORE_DNAME before running."
            exit 1
          fi
          keytool -genkeypair \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore artixpos-release.jks \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "$DNAME" \
            -noprompt

      - name: Print SHA-1 fingerprint (register this in Google Cloud Console)
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║         COPY THIS SHA-1 → Google Cloud Console              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          keytool -list -v \
            -keystore artixpos-release.jks \
            -alias "$ALIAS" \
            -storepass "$STORE_PASS" \
            -noprompt | grep -E "SHA1:|SHA-1:"
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║         ALSO COPY SHA-256 (for Play Store)                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          keytool -list -v \
            -keystore artixpos-release.jks \
            -alias "$ALIAS" \
            -storepass "$STORE_PASS" \
            -noprompt | grep "SHA256:"

      - name: Print base64 keystore (save as GitHub secret ANDROID_KEYSTORE_BASE64)
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║   COPY EVERYTHING BELOW → GitHub secret ANDROID_KEYSTORE_BASE64  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          base64 -w 0 artixpos-release.jks
          echo ""
          echo ""
          echo "GitHub secrets to add:"
          echo "  ANDROID_KEYSTORE_BASE64 = (the long base64 string above)"
          echo "  KEYSTORE_PASSWORD       = value of KEYSTORE_STORE_PASS secret"
          echo "  KEY_ALIAS               = value of KEY_ALIAS secret"
          echo "  KEY_PASSWORD            = value of KEYSTORE_KEY_PASS secret"
