# ── ArtixPOS — nginx reverse proxy ───────────────────────────────────────────
#
# Place this file at:  /etc/nginx/sites-available/artixpos
# Enable it:           ln -s /etc/nginx/sites-available/artixpos \
#                             /etc/nginx/sites-enabled/artixpos
# Test config:         nginx -t
# Reload:              systemctl reload nginx
#
# TLS (HTTPS) — obtain a certificate with:
#   certbot --nginx -d yourdomain.com
# Certbot will edit the ssl_* lines below automatically.
# ─────────────────────────────────────────────────────────────────────────────

upstream artixpos {
    # Node.js app (single port — cluster handles multi-core internally)
    server 127.0.0.1:5000;
    keepalive 64;
}

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt / Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # TLS — Certbot fills these in automatically
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── File upload size (receipts, product images, CSV imports) ─────────────
    client_max_body_size 50M;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── SSE (Server-Sent Events) — kitchen display / live orders ─────────────
    location /api/sse {
        proxy_pass         http://artixpos;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";       # keep connection open
        proxy_buffering    off;                 # stream immediately
        proxy_cache        off;
        proxy_read_timeout 3600s;               # 1-hour SSE sessions
        chunked_transfer_encoding on;
    }

    # ── WebSocket (Vite HMR in dev — remove in prod-only setup) ─────────────
    location /ws {
        proxy_pass         http://artixpos;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # ── All other traffic → Node app ─────────────────────────────────────────
    location / {
        proxy_pass         http://artixpos;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}
