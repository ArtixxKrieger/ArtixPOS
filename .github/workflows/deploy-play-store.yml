name: Deploy to Play Store

on:
  workflow_run:
    workflows: ["Build Android"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track to upload to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  deploy:
    name: Upload AAB to Play Store
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release AAB artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: android.yml
          workflow_conclusion: success
          branch: main
          name_is_regexp: true
          name: artixpos-release-.*
          path: aab-output/
          search_artifacts: true

      - name: Locate AAB file
        id: find_aab
        run: |
          AAB=$(find aab-output/ -name "*.aab" | head -1)
          if [ -z "$AAB" ]; then
            echo "❌ No AAB file found in artifact"
            exit 1
          fi
          echo "aab_path=$AAB" >> $GITHUB_OUTPUT
          echo "✅ Found AAB: $AAB"

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.artixpos.app
          releaseFiles: ${{ steps.find_aab.outputs.aab_path }}
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          inAppUpdatePriority: 2
