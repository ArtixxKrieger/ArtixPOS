<!DOCTYPE html>
<html lang="en" translate="no" style="background:#f2f2f7">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ArtixPOS</title>
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="ArtixPOS — BIR-compliant Philippine POS system with real-time sales, inventory, analytics, and payroll management." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="google" content="notranslate" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ArtixPOS" />
    <meta property="og:description" content="BIR-compliant Philippine POS system with real-time sales, inventory, analytics, and payroll management." />
    <meta property="og:image" content="/logo192.png" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ArtixPOS" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%;overflow:hidden}
      body{font-family:'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,sans-serif}

      :root{
        --sp-bg:#f2f2f7;
        --sp-accent:#7c3aed;
        --sp-muted:#9ca3af;
        --sp-card:#ffffff;
        --sp-border:#e5e5ea;
      }
      .dark{
        --sp-bg:#09090f;
        --sp-accent:#8b5cf6;
        --sp-muted:#4b4b6b;
        --sp-card:#13131f;
        --sp-border:#1f1f33;
      }

      /* ── Splash container ── */
      #app-splash{
        position:fixed;inset:0;z-index:9999;
        background:var(--sp-bg);
        display:flex;align-items:center;justify-content:center;
        overflow:hidden;
        transition:opacity 0.35s ease;
      }
      #app-splash.sp-hiding{
        animation:sp-out 0.35s ease forwards;
      }
      @keyframes sp-out{to{opacity:0;transform:scale(1.015)}}

      /* ── Canvas (behind everything) ── */
      #sp-canvas{
        position:absolute;inset:0;width:100%;height:100%;
        pointer-events:none;
      }

      /* ── Centre stack ── */
      .sp-center{
        position:relative;z-index:2;
        display:flex;flex-direction:column;align-items:center;
        gap:28px;
        animation:sp-rise 0.7s cubic-bezier(0.22,1,0.36,1) both;
      }
      @keyframes sp-rise{
        from{opacity:0;transform:translateY(24px)}
        to{opacity:1;transform:translateY(0)}
      }

      /* ── Wordmark ── */
      .sp-wordmark{
        font-size:clamp(28px,5vw,42px);
        font-weight:800;
        letter-spacing:0.18em;
        color:var(--sp-accent);
        font-family:'Plus Jakarta Sans',sans-serif;
        user-select:none;
        animation:sp-word-in 0.9s cubic-bezier(0.22,1,0.36,1) both;
      }
      @keyframes sp-word-in{
        from{opacity:0;transform:translateY(6px)}
        to{opacity:1;transform:translateY(0)}
      }

      /* ── Crash / error UI (keep working) ── */
      #sp-crash{
        position:fixed;inset:0;display:flex;align-items:center;
        justify-content:center;background:#0a0a12;
        font-family:monospace;padding:24px;z-index:99999;
      }
    </style>

    <script>window.__splashStart = Date.now();</script>
    <script>
      (function() {
        /* ── Dark mode: apply before React renders to avoid flash ── */
        try {
          var stored = localStorage.getItem('theme');
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          var isDark = stored === 'dark' || (!stored && mq.matches);
          document.documentElement.style.background = isDark ? '#09090f' : '#f2f2f7';
          if (isDark) document.documentElement.classList.add('dark');
          mq.addEventListener('change', function(e) {
            if (!localStorage.getItem('theme')) {
              document.documentElement.classList.toggle('dark', e.matches);
              document.documentElement.style.background = e.matches ? '#09090f' : '#f2f2f7';
            }
          });
        } catch(e) {}

        /* ── Disable right-click context menu ── */
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });

        /* ── Block common devtools keyboard shortcuts ── */
        document.addEventListener('keydown', function(e) {
          if (e.key === 'F12') { e.preventDefault(); return false; }
          if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
            e.preventDefault(); return false;
          }
          if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
          if (e.metaKey && e.altKey && (e.key === 'I' || e.key === 'i')) { e.preventDefault(); return false; }
        });

        /* ── One-time console warning ── */
        console.log('%cSTOP!', 'color: red; font-size: 48px; font-weight: bold;');
        console.log('%cThis browser feature is for developers only. Do not paste anything here. Doing so may compromise your account.', 'color: black; font-size: 16px;');

        /* ── Stale-SW auto-recovery ── */
        (function() {
          var STALE_KEY = '_artix_stale_reload';
          var CRASH_KEY = '_artix_crash';

          function isChunkError(msg) {
            var s = String(msg || '');
            return (
              s.indexOf('ChunkLoadError') !== -1 ||
              s.indexOf('Loading chunk') !== -1 ||
              s.indexOf('Loading CSS chunk') !== -1 ||
              s.indexOf('Failed to fetch dynamically imported module') !== -1 ||
              s.indexOf('Importing a module script failed') !== -1 ||
              s.indexOf('Unable to preload CSS') !== -1
            );
          }

          function nukeCacheAndReload() {
            try {
              var attempts = parseInt(sessionStorage.getItem(STALE_KEY) || '0', 10);
              if (attempts >= 3) return false;
              sessionStorage.setItem(STALE_KEY, String(attempts + 1));
              var doReload = function() { window.location.reload(); };
              if (navigator.serviceWorker) {
                navigator.serviceWorker.getRegistrations()
                  .then(function(regs) {
                    return Promise.all(regs.map(function(r) { return r.unregister().catch(function(){}); }));
                  })
                  .catch(function(){})
                  .finally(function() {
                    if (window.caches) {
                      caches.keys()
                        .then(function(keys) {
                          return Promise.all(keys.map(function(k) { return caches.delete(k).catch(function(){}); }));
                        })
                        .catch(function(){})
                        .finally(doReload);
                    } else { doReload(); }
                  });
              } else if (window.caches) {
                caches.keys()
                  .then(function(keys) {
                    return Promise.all(keys.map(function(k) { return caches.delete(k).catch(function(){}); }));
                  })
                  .catch(function(){})
                  .finally(doReload);
              } else { doReload(); }
              return true;
            } catch(e) { return false; }
          }

          var _shown = false;
          function _showCrash(msg) {
            if (_shown) return;
            var splash = document.getElementById('app-splash');
            if (splash) { try { splash.remove(); } catch(e) {} }
            var root = document.getElementById('root');
            if (root) {
              _shown = true;
              function _escHtml(s) {
                return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
              }
              root.innerHTML =
                '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a12;font-family:monospace;padding:24px;z-index:99999">'
                + '<div style="max-width:480px;width:100%;background:#1a1a2e;border:1px solid #ff4d4d;border-radius:12px;padding:20px;color:#fff;">'
                + '<p style="color:#ff4d4d;font-weight:bold;font-size:14px;margin:0 0 8px">App failed to load</p>'
                + '<pre style="font-size:11px;color:#ffb3b3;white-space:pre-wrap;word-break:break-word;margin:0 0 16px;max-height:200px;overflow:auto">'
                + _escHtml(msg) + '</pre>'
                + '<button onclick="(function(){try{sessionStorage.removeItem(\'' + STALE_KEY + '\');}catch(e){}'
                + 'try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister()})});'
                + 'if(window.caches)caches.keys().then(function(k){k.forEach(function(c){caches.delete(c)})})}catch(e){}'
                + 'setTimeout(function(){window.location.reload()},400)})()" '
                + 'style="background:#7c3aed;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:13px;cursor:pointer;width:100%">'
                + 'Clear cache &amp; reload</button>'
                + '</div></div>';
              try { sessionStorage.setItem(CRASH_KEY, String(msg)); } catch(e) {}
            }
          }

          try {
            var prev = sessionStorage.getItem(CRASH_KEY);
            if (prev) { sessionStorage.removeItem(CRASH_KEY); _showCrash('[Previous load] ' + prev); }
          } catch(e) {}

          window.onerror = function(msg, src, line) {
            var full = String(msg) + '\n' + (src||'') + ':' + (line||'');
            if (isChunkError(full)) { if (nukeCacheAndReload()) return; }
            _showCrash(full);
          };

          window.addEventListener('unhandledrejection', function(e) {
            var r = e.reason;
            var msg = r && r.message ? r.message + '\n' + (r.stack||'') : String(r);
            if (isChunkError(msg)) { if (nukeCacheAndReload()) return; }
            _showCrash('Unhandled rejection: ' + msg);
          });
        })();

        /* ── Auth-loop watchdog ── */
        (function() {
          var LOOP_KEY = '_artix_loop_redirect';
          try {
            if (sessionStorage.getItem(LOOP_KEY)) {
              sessionStorage.removeItem(LOOP_KEY);
              return;
            }
          } catch(e) {}

          var authMeCount = 0;
          var windowStart = Date.now();
          var WINDOW_MS = 10000;
          var THRESHOLD = 5;

          var _origFetch = window.fetch;
          window.fetch = function(input, init) {
            var url = (typeof input === 'string') ? input : (input && input.url) ? input.url : '';
            if (url.indexOf('/api/auth/me') !== -1) {
              var now = Date.now();
              if (now - windowStart > WINDOW_MS) { authMeCount = 0; windowStart = now; }
              authMeCount++;
              if (authMeCount >= THRESHOLD) {
                authMeCount = 0;
                try { sessionStorage.setItem(LOOP_KEY, '1'); } catch(e) {}
                window.location.replace('/clear.html');
                return new Promise(function() {});
              }
            }
            return _origFetch.apply(this, arguments);
          };
        })();
      })();
    </script>
  </head>
  <body>
    <div id="app-splash" role="presentation" aria-hidden="true">
      <canvas id="sp-canvas"></canvas>

      <div class="sp-center">
        <div class="sp-wordmark">ARTIXPOS</div>
      </div>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <script>
      /* ── Interactive particle canvas loader ── */
      (function(){
        var canvas = document.getElementById('sp-canvas');
        if (!canvas || !canvas.getContext) return;
        var ctx = canvas.getContext('2d');
        var W = 0, H = 0;
        var mouse = { x: -9999, y: -9999 };
        var particles = [];
        var raf;
        var alive = true;

        function resize() {
          W = canvas.width = window.innerWidth;
          H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize, { passive: true });

        /* Mouse / touch tracking */
        window.addEventListener('mousemove', function(e) {
          mouse.x = e.clientX; mouse.y = e.clientY;
        }, { passive: true });
        window.addEventListener('touchmove', function(e) {
          var t = e.touches[0];
          mouse.x = t.clientX; mouse.y = t.clientY;
        }, { passive: true });
        window.addEventListener('touchend', function() {
          mouse.x = -9999; mouse.y = -9999;
        }, { passive: true });


        /* Build particles — distributed across screen with bias toward edges */
        var DARK_COLORS  = ['139,92,246', '167,139,250', '196,181,253', '124,58,237', '216,180,254'];
        var LIGHT_COLORS = ['124,58,237',  '109,40,217',  '139,92,246',  '91,33,182',  '167,139,250'];

        for (var i = 0; i < 75; i++) {
          var angle = Math.random() * Math.PI * 2;
          var spread = window.innerWidth > 768 ? 0.55 : 0.45;
          var r = (Math.random() * 0.35 + spread) * Math.max(window.innerWidth, window.innerHeight);
          var ox = W/2 + Math.cos(angle) * r;
          var oy = H/2 + Math.sin(angle) * r;
          particles.push({
            x: ox, y: oy,
            ox: ox, oy: oy,
            size: Math.random() * 2.2 + 0.4,
            alpha: Math.random() * 0.45 + 0.1,
            phase: Math.random() * Math.PI * 2,
            speed: 0.003 + Math.random() * 0.007,
            drift: 25 + Math.random() * 55,
            colorIdx: Math.floor(Math.random() * 5),
          });
        }


        /* Draw loop */
        function draw() {
          if (!alive) return;
          ctx.clearRect(0, 0, W, H);

          var dark = document.documentElement.classList.contains('dark');
          var colors = dark ? DARK_COLORS : LIGHT_COLORS;

          for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            p.phase += p.speed;

            /* Sinusoidal drift around origin */
            var tx = p.ox + Math.sin(p.phase) * p.drift;
            var ty = p.oy + Math.cos(p.phase * 0.71) * p.drift * 0.65;

            /* Mouse repulsion */
            var dx = tx - mouse.x;
            var dy = ty - mouse.y;
            var d2 = dx*dx + dy*dy;
            if (d2 < 14400) { /* 120px radius */
              var d = Math.sqrt(d2);
              var force = (1 - d/120) * 90;
              tx += (dx/d) * force;
              ty += (dy/d) * force;
            }

            /* Ease toward target */
            p.x += (tx - p.x) * 0.055;
            p.y += (ty - p.y) * 0.055;

            var a = p.alpha * (0.65 + 0.35 * Math.sin(p.phase * 1.7));
            var rgb = colors[p.colorIdx];

            /* Core dot */
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, 6.2832);
            ctx.fillStyle = 'rgba(' + rgb + ',' + a.toFixed(2) + ')';
            ctx.fill();

            /* Soft halo for larger particles */
            if (p.size > 1.6) {
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size * 3.5, 0, 6.2832);
              ctx.fillStyle = 'rgba(' + rgb + ',' + (a * 0.12).toFixed(3) + ')';
              ctx.fill();
            }
          }

          raf = requestAnimationFrame(draw);
        }

        draw();

        /* Cleanup when splash is removed by React */
        var mo = new MutationObserver(function(muts) {
          muts.forEach(function(m) {
            m.removedNodes.forEach(function(n) {
              if (n.id === 'app-splash') {
                alive = false;
                cancelAnimationFrame(raf);
                window.removeEventListener('resize', resize);
                mo.disconnect();
              }
            });
          });
        });
        mo.observe(document.body, { childList: true });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
