name: 🔑 Generate Release Keystore (run once)

# Run this ONCE manually to generate your signing key.
# After running, copy the outputs into your GitHub secrets.
# Then you can disable or delete this workflow.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias artixpos \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore artixpos-release.jks \
            -storepass artixpos2024 \
            -keypass artixpos2024 \
            -dname "CN=ArtixPOS, OU=Mobile, O=ArtixPOS, L=Manila, ST=Metro Manila, C=PH" \
            -noprompt

      - name: Print SHA-1 fingerprint (register this in Google Cloud Console)
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║         COPY THIS SHA-1 → Google Cloud Console              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          keytool -list -v \
            -keystore artixpos-release.jks \
            -alias artixpos \
            -storepass artixpos2024 \
            -noprompt | grep -E "SHA1:|SHA-1:"
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║         ALSO COPY SHA-256 (for Play Store)                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          keytool -list -v \
            -keystore artixpos-release.jks \
            -alias artixpos \
            -storepass artixpos2024 \
            -noprompt | grep "SHA256:"

      - name: Print base64 keystore (save as GitHub secret ANDROID_KEYSTORE_BASE64)
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║   COPY EVERYTHING BELOW → GitHub secret ANDROID_KEYSTORE_BASE64  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          base64 -w 0 artixpos-release.jks
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "GitHub secrets to add:"
          echo "  ANDROID_KEYSTORE_BASE64 = (the long base64 string above)"
          echo "  KEYSTORE_PASSWORD       = artixpos2024"
          echo "  KEY_ALIAS               = artixpos"
          echo "  KEY_PASSWORD            = artixpos2024"
