version: "3.9"

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: artixpos
      POSTGRES_USER: artixpos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artixpos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ArtixPOS app ─────────────────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://artixpos:${POSTGRES_PASSWORD:-changeme}@db:5432/artixpos
      SESSION_SECRET: ${SESSION_SECRET}

      # ── OAuth (optional) ──────────────────────────────────────────────────────
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}

      # ── AI assistant (optional) ───────────────────────────────────────────────
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}

      # ── Email / password reset (optional) ─────────────────────────────────────
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      APP_URL: ${APP_URL:-}

      # ── Redis L2 cache (optional) ─────────────────────────────────────────────
      # The app uses the Upstash REST API, not the native Redis protocol.
      # If you have an Upstash account set these two vars; otherwise the app
      # falls back to a fast in-memory cache automatically — no action needed.
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}

      # ── Observability (optional) ───────────────────────────────────────────────
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/auth/config || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pg_data:
